name: Web CI

on:
  push:
    branches: [ main, master ]
    paths:
      - 'myfloorplan-web/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'myfloorplan-web/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm --filter myfloorplan-web run lint

      - name: Build
        run: pnpm --filter myfloorplan-web run build
